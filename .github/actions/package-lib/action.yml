name: package-lib
description: Package Pd library via deken

runs:
  using: "composite"
  steps:
    - name: Prepare folder structure
      shell: bash
      run: |
        mkdir -p fd_lib/sources/pd-lib-builder

    - name: Copy sources
      shell: bash
      run: |
        cp Makefile config.sh fd_lib/sources/
        cp src/*.{h,c} fd_lib/sources/ || true
        cp pd-lib-builder/Makefile.pdlibbuilder fd_lib/sources/pd-lib-builder/

    - name: Copy built artifacts
      shell: bash
      run: |
        cp fd_lib.* fd_lib/

    - name: Install deken
      shell: bash
      run: |
        curl -L https://raw.githubusercontent.com/pure-data/deken/main/developer/deken -o deken
        chmod +x deken

    - name: Package library
      shell: bash
      run: |
        ./deken package --version "${GITHUB_REF_NAME:-main}" fd_lib

