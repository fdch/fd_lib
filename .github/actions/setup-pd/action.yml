name: Setup Pure Data
description: Checkout code and setup Pure Data dependencies

runs:
  using: composite
  steps:
    - uses: actions/checkout@v5
    - name: get pdlibbuilder
      shell: bash
      run: git submodule init && git submodule update

    - name: get pd
      uses: actions/checkout@v5
      with:
        repository: pure-data/pure-data
        path: pure-data

    - name: ls files
      run: ls -la
